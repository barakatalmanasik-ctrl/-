var processed=0;
function addProgram(p,idx){
  var data={
    name:p.name,price:p.price,shortDesc:p.shortDesc,fullDesc:p.fullDesc,
    duration:p.duration,departureDate:p.departureDate,
    programStatus:p.programStatus,status:p.status,
    transport:p.transport,airlines:p.airlines||'',
    hotelMakkah:p.hotelMakkah||'',hotelMadinah:p.hotelMadinah||'',
    hotelStars:p.hotelStars||0,meals:p.meals||'',
    servicesIncluded:p.servicesIncluded||'',notes:p.notes||'',
    mainImage:p.mainImage,gallery:p.gallery||[],
    days:p.days||0,nights:p.nights||0,
    order:p.order,seats:p.seats||0,seatsLeft:p.seatsLeft||0,
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  };
  db.collection('programs').add(data).then(function(ref){
    var batch=db.batch();
    (p.timeline||[]).forEach(function(tl,i){
      var tlRef=ref.collection('timeline').doc();
      batch.set(tlRef,{day:tl.day,title:tl.title,description:tl.description,images:tl.images||[],order:i});
    });
    return batch.commit().then(function(){
      processed++;
      statusEl.innerHTML+='<br>✅ تمت إضافة: '+p.name;
      if(processed===programsData.length){
        statusEl.innerHTML+='<br><br><strong style="color:green;">تم نقل جميع البرامج بنجاح! يمكنك إغلاق هذه الصفحة.</strong>';
      }
    });
  }).catch(function(e){
    statusEl.innerHTML+='<br>❌ خطأ: '+e.message;
  });
}

statusEl.textContent='جاري البدء...';
programsData.forEach(function(p,i){setTimeout(function(){addProgram(p,i)},i*500)});
