<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة | بركات المناسك</title>
<link rel="icon" type="image/png" href="../Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- Header -->
<header class="dash-header">
  <div class="dash-logo">
    <img src="../Logo.png" alt="بركات المناسك">
    <span>لوحة الإدارة</span>
  </div>
  <div class="dash-header-actions">
    <a href="../index.html" class="dash-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      الموقع
    </a>
    <button class="dash-logout" id="logoutBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      خروج
    </button>
  </div>
</header>

<!-- Dashboard Body -->
<main class="dash-body">

  <!-- ═══ Stats Row ═══ -->
  <div class="stats-row">
    <div class="stat-card stat-total">
      <div class="stat-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      </div>
      <div class="stat-info">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">إجمالي التعليقات</div>
      </div>
    </div>
    <div class="stat-card stat-pending-card">
      <div class="stat-icon stat-icon-pending">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div class="stat-info">
        <div class="stat-num" id="statPending">0</div>
        <div class="stat-label">معلّقة</div>
      </div>
    </div>
    <div class="stat-card stat-approved-card">
      <div class="stat-icon stat-icon-approved">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="stat-info">
        <div class="stat-num" id="statApproved">0</div>
        <div class="stat-label">معتمدة</div>
      </div>
    </div>
    <div class="stat-card stat-rejected-card">
      <div class="stat-icon stat-icon-rejected">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      </div>
      <div class="stat-info">
        <div class="stat-num" id="statRejected">0</div>
        <div class="stat-label">مرفوضة</div>
      </div>
    </div>
    <div class="stat-card stat-avg-card">
      <div class="stat-icon stat-icon-avg">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      </div>
      <div class="stat-info">
        <div class="stat-num"><span id="statAvg">0.0</span> <span class="stat-avg-label">/ 5</span></div>
        <div class="stat-label">متوسط التقييم</div>
        <div id="statAvgStars" class="stat-avg-stars"></div>
      </div>
    </div>
  </div>

  <div class="admin-grid">

    <!-- ═══ 1. Comments Card ═══ -->
    <div class="admin-card">
      <div class="admin-card-header">
        <h2>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="1.5" stroke-linecap="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          إدارة التعليقات
        </h2>
      </div>
      <div class="admin-card-body">
        <!-- Tabs -->
        <div class="tabs">
          <button class="tab-btn" data-filter="all">الكل <span class="tab-badge" id="badgeAll">0</span></button>
          <button class="tab-btn active" data-filter="pending">معلّق <span class="tab-badge tab-badge-pending" id="badgePending">0</span></button>
          <button class="tab-btn" data-filter="approved">معتمد <span class="tab-badge tab-badge-approved" id="badgeApproved">0</span></button>
          <button class="tab-btn" data-filter="rejected">مرفوض <span class="tab-badge tab-badge-rejected" id="badgeRejected">0</span></button>
        </div>
        <div class="comment-list" id="commentList">
          <div class="comment-empty">جاري التحميل...</div>
        </div>
      </div>
    </div>

    <!-- ═══ 2. Images Card ═══ -->
    <div class="admin-card">
      <div class="admin-card-header">
        <h2>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          صور الموقع
        </h2>
      </div>
      <div class="admin-card-body">
        <div class="upload-zone" id="uploadZone">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <p>اسحب الصورة هنا أو انقر للاختيار</p>
          <span>PNG, JPG, WEBP — حد أقصى 5MB</span>
          <input type="file" id="uploadInput" class="upload-input" accept="image/*">
        </div>
        <div class="img-grid" id="imageGrid"></div>
      </div>
    </div>

    <!-- ═══ 3. Company Data Card ═══ -->
    <div class="admin-card">
      <div class="admin-card-header">
        <h2>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          بيانات الشركة
        </h2>
      </div>
      <div class="admin-card-body">
        <form class="data-form" id="dataForm">
          <div class="data-row">
            <div class="data-field">
              <label>رقم الهاتف الرئيسي</label>
              <input type="text" id="phone1" placeholder="07744641155">
            </div>
            <div class="data-field">
              <label>رقم الهاتف الثاني</label>
              <input type="text" id="phone2" placeholder="07712441233">
            </div>
          </div>
          <div class="data-row">
            <div class="data-field">
              <label>رقم خدمة الزبائن</label>
              <input type="text" id="phone3" placeholder="07801733892">
            </div>
            <div class="data-field">
              <label>ساعات العمل</label>
              <input type="text" id="hours" placeholder="يومياً من 8:00 صباحاً حتى 10:00 مساءً">
            </div>
          </div>
          <div class="data-row">
            <div class="data-field">
              <label>العنوان</label>
              <input type="text" id="address" placeholder="كربلاء المقدسة – قضاء الحر">
            </div>
            <div class="data-field">
              <label>رابط انستغرام</label>
              <input type="url" id="instagram" placeholder="https://www.instagram.com/barakat_almanasik">
            </div>
          </div>
          <div class="data-field">
            <label>نبذة عن الشركة</label>
            <textarea id="about" placeholder="نبذة مختصرة عن شركة بركات المناسك..."></textarea>
            <span class="hint">تظهر في قسم "من نحن" بالموقع</span>
          </div>
          <button type="submit" class="data-save" id="saveBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
            حفظ التغييرات
          </button>
        </form>
      </div>
    </div>

  </div>
</main>

<!-- ═══ Edit Modal ═══ -->
<div class="modal-overlay" id="editModal">
  <div class="modal-card">
    <div class="modal-header">
      <h3>تعديل التعليق</h3>
      <button class="modal-close" id="editCloseBtn" aria-label="إغلاق">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form class="modal-body" id="editForm">
      <div class="modal-field">
        <label>الاسم</label>
        <input type="text" id="editName" required minlength="3" maxlength="100">
      </div>
      <div class="modal-field">
        <label>الخدمة</label>
        <input type="text" id="editService" maxlength="50">
      </div>
      <div class="modal-field">
        <label>التعليق</label>
        <textarea id="editText" rows="3" required minlength="10" maxlength="500"></textarea>
      </div>
      <div class="modal-row">
        <div class="modal-field">
          <label>التقييم</label>
          <div class="modal-stars" id="editStarsWrap"></div>
          <input type="hidden" id="editStarsValue" value="5">
        </div>
        <div class="modal-field">
          <label>الحالة</label>
          <select id="editStatus">
            <option value="pending">معلّق</option>
            <option value="approved">معتمد</option>
            <option value="rejected">مرفوض</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="modal-btn modal-btn-cancel" id="editCancelBtn">إلغاء</button>
        <button type="submit" class="modal-btn modal-btn-save">حفظ التعديلات</button>
      </div>
    </form>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
