<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 | بركات المناسك</title>
<link rel="icon" type="image/png" href="Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Tajawal:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#111D35 0%,#1B2A4A 50%,#2D4373 100%);
  font-family:'Tajawal',sans-serif;
  color:#fff;
  text-align:center;
  padding:24px;
}
.card{
  max-width:460px;
  width:100%;
}
.code{
  font-family:'Cairo',sans-serif;
  font-size:120px;
  font-weight:800;
  line-height:1;
  background:linear-gradient(135deg,#C9A96E 0%,#E8D5A8 50%,#C9A96E 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:16px;
}
.title{
  font-family:'Cairo',sans-serif;
  font-size:24px;
  font-weight:700;
  margin-bottom:12px;
  color:#F1F3F7;
}
.desc{
  font-size:15px;
  color:#8C95A8;
  line-height:1.7;
  margin-bottom:32px;
}
.links{
  display:flex;gap:12px;justify-content:center;flex-wrap:wrap;
}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 28px;
  border-radius:999px;
  font-size:14px;font-weight:600;
  text-decoration:none;
  transition:all .3s cubic-bezier(.4,0,.2,1);
  border:none;cursor:pointer;
}
.btn-primary{
  background:#C9A96E;color:#111D35;
}
.btn-primary:hover{
  background:#E8D5A8;transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(201,169,110,.25);
}
.btn-outline{
  background:transparent;color:#C9A96E;
  border:1.5px solid rgba(201,169,110,.35);
}
.btn-outline:hover{
  border-color:#C9A96E;background:rgba(201,169,110,.08);
  transform:translateY(-2px);
}
.icon{width:20px;height:20px}
@media(max-width:480px){
  .code{font-size:80px}
  .title{font-size:20px}
  .links{flex-direction:column;align-items:center}
}
</style>
</head>
<body>
<div class="card">
  <div class="code">404</div>
  <h1 class="title">الصفحة غير موجودة</h1>
  <p class="desc">عذراً، الصفحة التي تبحث عنها غير موجودة أو تم نقلها.<br>يمكنك العودة إلى الصفحة الرئيسية.</p>
  <div class="links">
    <a href="index.html" class="btn btn-primary">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      الصفحة الرئيسية
    </a>
    <a href="javascript:history.back()" class="btn btn-outline">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      رجوع
    </a>
  </div>
</div>
</body>
</html>
